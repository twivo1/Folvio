<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Folvio</title>
  <rect x="64" y="64" width="896" height="896" rx="150" fill="#15191C"/>
  <!-- stem: front side of the folded strip -->
  <path d="M300 410 L450 410 L450 780 L300 780 Z" fill="#F2F4F3"/>
  <!-- fold corner: crease from outer to inner corner -->
  <path d="M300 260 L300 410 L450 410 Z" fill="#F2F4F3"/>
  <path d="M300 260 L450 260 L450 410 Z" fill="#0E7563"/>
  <!-- top arm: back side after the fold (the "other format") -->
  <path d="M450 260 L760 260 L760 410 L450 410 Z" fill="#17A589"/>
  <!-- middle arm -->
  <path d="M450 500 L650 500 L650 640 L450 640 Z" fill="#F2F4F3"/>
</svg>
